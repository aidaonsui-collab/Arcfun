[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "cancun" # required by v4-core (tstore/tload) — matches the source repo's own setting
optimizer = true
optimizer_runs = 200
# bytecode_hash left at solc default to match the deployed contract's metadata
via_ir = true

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "v4-core/=lib/v4-core/",
]

[fuzz]
runs = 2000

[profile.deploy]
optimizer = true
optimizer_runs = 1
via_ir = true
