[profile.default]
src = "src"
out = "out"
libs = ["lib", "../arc-nft/lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
evm_version = "cancun"
ffi = false

# Standalone: `forge install foundry-rs/forge-std` (lib/forge-std).
# Or after cloning Arcfun submodules, reuse ../arc-nft/lib via the second remapping.
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256
